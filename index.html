<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeBox — Официальный магазин БоксПВП</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Подключаем CryptoJS для генерации HMAC-MD5 подписи WayForPay -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #07090e;
            color: #f1f5f9;
            user-select: none;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0f17;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3b82f6;
        }

        .glass-card {
            background: rgba(15, 20, 31, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card-hover {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card-hover:hover {
            transform: translateY(-4px);
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 12px 30px -10px rgba(37, 99, 235, 0.25);
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]:focus {
            outline: none;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: #1e293b;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        input[type=range]::-webkit-slider-thumb {
            height: 22px;
            width: 22px;
            border-radius: 50%;
            background: #2563eb;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -7px;
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.8);
            transition: transform 0.1s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            background: #3b82f6;
        }

        .mc-head {
            image-rendering: pixelated;
        }

        .badge-discount {
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            clip-path: polygon(0 0, 100% 0, 90% 100%, 0% 100%);
        }

        .payment-method-card {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .payment-method-card.selected {
            border-color: #2563eb !important;
            background: rgba(37, 99, 235, 0.12) !important;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-16">

    <div>
        <!-- HEADER -->
        <header class="w-full max-w-7xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center text-white text-xl font-black shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-cube"></i>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <span class="font-extrabold text-lg text-white tracking-wide">PrimeBox</span>
                        <span class="text-xs text-gray-400 font-semibold uppercase px-2 py-0.5 rounded bg-slate-800/80 border border-slate-700/50">- БОКСПВП</span>
                    </div>
                    <p class="text-xs text-gray-400 font-medium">Официальный магазин</p>
                </div>
            </div>

            <nav class="flex items-center bg-slate-900/80 p-1.5 rounded-xl border border-slate-800/80">
                <a href="#" class="px-5 py-2 rounded-lg text-sm font-bold bg-blue-600 text-white shadow-md transition-all">ГЛАВНАЯ</a>
                <a href="#store-section" class="px-5 py-2 rounded-lg text-sm font-semibold text-gray-400 hover:text-white transition-all">МАГАЗИН</a>
            </nav>

            <div class="flex items-center space-x-3">
                <div class="flex items-center space-x-2">
                    <a href="https://t.me" target="_blank" class="w-9 h-9 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-gray-400 hover:text-blue-400 hover:border-blue-500/50 transition-all">
                        <i class="fa-brands fa-telegram text-sm"></i>
                    </a>
                    <a href="https://discord.com" target="_blank" class="w-9 h-9 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-gray-400 hover:text-indigo-400 hover:border-indigo-500/50 transition-all">
                        <i class="fa-brands fa-discord text-sm"></i>
                    </a>
                    <a href="https://vk.com" target="_blank" class="w-9 h-9 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-gray-400 hover:text-blue-500 hover:border-blue-500/50 transition-all">
                        <i class="fa-brands fa-vk text-sm"></i>
                    </a>
                </div>

                <div class="flex items-center bg-slate-900 border border-slate-800 rounded-xl p-1 text-xs font-bold">
                    <button class="px-2.5 py-1 rounded-lg bg-slate-800 text-white flex items-center gap-1">
                        <span class="w-3.5 h-2.5 bg-red-600 inline-block rounded-xs"></span> RU
                    </button>
                    <button class="px-2.5 py-1 rounded-lg text-gray-400 hover:text-white flex items-center gap-1">
                        <span class="w-3.5 h-2.5 bg-blue-600 inline-block rounded-xs"></span> EN
                    </button>
                </div>
            </div>
        </header>

        <!-- HERO BANNER -->
        <section class="max-w-7xl mx-auto px-4 my-4">
            <div class="relative w-full rounded-3xl overflow-hidden glass-card border border-blue-500/20 p-8 md:p-12 flex flex-col items-center justify-center text-center shadow-2xl">
                <div class="absolute inset-0 bg-gradient-to-r from-blue-900/30 via-slate-900/90 to-blue-950/30 -z-10"></div>
                <div class="absolute top-0 right-1/4 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl -z-10"></div>
                
                <div class="flex items-center space-x-2 text-blue-400 font-bold text-sm bg-blue-500/10 border border-blue-500/20 px-3 py-1 rounded-full mb-4">
                    <i class="fa-solid fa-fire"></i>
                    <span>PrimeBox 1.16.5 - 1.21.8</span>
                </div>

                <h1 class="text-3xl md:text-5xl font-black tracking-tight text-white mb-6">
                    Добро пожаловать <br class="hidden sm:inline"/>на сайт
                </h1>

                <div class="flex flex-wrap items-center justify-center gap-3">
                    <button onclick="copyToClipboard('https://ewnec.github.io/frikibixbox/')" class="flex items-center space-x-3 bg-slate-900/90 hover:bg-slate-800 border border-slate-700/80 px-4 py-2.5 rounded-2xl transition-all group">
                        <i class="fa-solid fa-globe text-blue-400 group-hover:scale-110 transition-transform"></i>
                        <span class="text-sm font-bold text-gray-200">ewnec.github.io/frikibixbox/</span>
                        <i class="fa-regular fa-copy text-xs text-gray-400 group-hover:text-white"></i>
                    </button>

                    <button onclick="copyToClipboard('primebox.aurorix.pro')" class="flex items-center space-x-3 bg-slate-900/90 hover:bg-slate-800 border border-slate-700/80 px-4 py-2.5 rounded-2xl transition-all group">
                        <i class="fa-solid fa-server text-blue-400 group-hover:scale-110 transition-transform"></i>
                        <span class="text-sm font-bold text-gray-200">primebox.aurorix.pro</span>
                        <i class="fa-regular fa-copy text-xs text-gray-400 group-hover:text-white"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- TITLE -->
        <section id="store-section" class="max-w-7xl mx-auto px-4 mt-8 mb-4">
            <h2 class="text-2xl font-black text-white">Покупка товаров</h2>
            <p class="text-xs text-gray-400 mt-1">Выберите нужный товар и оплачивайте</p>
        </section>

        <!-- CALCULATOR (СУХАРИКИ) -->
        <section class="max-w-7xl mx-auto px-4 mb-8">
            <div class="glass-card rounded-2xl p-5 md:p-6 border border-slate-800 flex flex-col lg:flex-row items-center justify-between gap-6">
                <div class="flex items-center space-x-4 w-full lg:w-auto">
                    <div class="w-14 h-14 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center text-amber-400 text-2xl shrink-0 shadow-inner">
                        <i class="fa-solid fa-cookie-bite"></i>
                    </div>
                    <div>
                        <div class="flex items-center space-x-2">
                            <span id="slider-crystals-title" class="font-extrabold text-lg text-white">50 Сухариков</span>
                        </div>
                        <span class="text-xs text-blue-400 font-semibold px-2 py-0.5 rounded bg-blue-500/10 border border-blue-500/20">BoxPvP</span>
                    </div>
                </div>

                <div class="w-full lg:flex-1 max-w-xl px-2">
                    <div class="flex justify-between items-center text-xs text-gray-400 mb-2 font-medium">
                        <span>Количество</span>
                        <span id="slider-val-label" class="font-bold text-white">50</span>
                    </div>
                    <input type="range" id="crystal-range" min="50" max="100
